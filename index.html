<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Museum of Chairs — Anamika Nandi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    :root {
      --bg-dark: #070709;
      --floor-color-top: #29180e;
      --floor-color-mid: #4a2d1a;
      --floor-color-bot: #21130a;
      --accent-gold: #d4af37;
      --accent-brass: #b38b4d;
      --accent-blue: #007aff;
      --bubble-gray: #e9e9eb;
      --plinth-white: #f5f4ef;
      --glass-tint: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.4);
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: #f7f6f2;
      user-select: none;
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .screen.active {
      display: flex;
      opacity: 1;
      z-index: 2;
    }

    /* ==========================================================================
       SCENE 1: CHAT INTERFACE
       ========================================================================== */
    #scene-chat {
      background: radial-gradient(circle at center, #181822 0%, #08080c 100%);
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    .chat-container {
      width: 90%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      transform-origin: center center;
      transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.8s ease;
    }

    .chat-bubble {
      position: relative;
      padding: 1.15rem 1.6rem;
      border-radius: 26px;
      font-size: 1.15rem;
      line-height: 1.4;
      max-width: 85%;
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(24px);
      animation: bubbleIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .chat-bubble.received {
      align-self: flex-start;
      background: var(--bubble-gray);
      color: #000000;
      border-bottom-left-radius: 4px;
      animation-delay: 0.35s;
    }

    .chat-bubble.received::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: -8px;
      width: 14px;
      height: 14px;
      background: var(--bubble-gray);
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
    }

    .chat-bubble.sent {
      align-self: flex-end;
      background: var(--accent-blue);
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-bottom-right-radius: 4px;
      animation-delay: 1.4s;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .chat-bubble.sent::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: -8px;
      width: 14px;
      height: 14px;
      background: var(--accent-blue);
      clip-path: polygon(0 0, 0 100%, 100% 100%);
    }

    .chat-bubble.sent.interactive-pulse {
      animation: pulseAttention 1.8s infinite;
    }

    .chat-bubble.sent:hover {
      filter: brightness(1.15);
      transform: scale(1.03);
    }

    .tap-hint {
      position: absolute;
      bottom: -32px;
      right: 8px;
      font-size: 0.76rem;
      color: #6eb3ff;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.5s ease;
      white-space: nowrap;
    }

    .chat-bubble.sent.interactive-pulse .tap-hint {
      opacity: 1;
    }

    @keyframes bubbleIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseAttention {
      0% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.7); }
      70% { box-shadow: 0 0 0 22px rgba(0, 122, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0); }
    }

    .chat-zooming {
      transform: scale(14) translate(-10%, -10%) !important;
      opacity: 0 !important;
      pointer-events: none;
    }

    /* ==========================================================================
       SCENE 2: MUSEUM DOOR (EXTERIOR)
       ========================================================================== */
    #scene-door {
      position: relative;
      align-items: center;
      justify-content: center;
      background: #09090c;
    }

    .door-backdrop {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-image: linear-gradient(rgba(10, 8, 12, 0.4), rgba(10, 8, 12, 0.8)), url('JUST-A-CHAIR-PORTFOLIO/images/museum_door.jpg');
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
    }

    .door-facade-container {
      position: relative;
      z-index: 10;
      width: min(440px, 86vw);
      height: min(720px, 82vh);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .door-arch-frame {
      width: 100%;
      height: 100%;
      border: 14px solid #372e27;
      border-bottom: 22px solid #231c17;
      border-radius: 220px 220px 6px 6px;
      box-shadow: 0 35px 90px rgba(0,0,0,0.95), inset 0 0 45px rgba(0,0,0,0.85);
      position: relative;
      overflow: hidden;
      background: #140d09;
      display: flex;
      transition: transform 0.5s ease;
    }

    .door-facade-container:hover .door-arch-frame {
      transform: scale(1.015);
    }

    .door-leaf {
      flex: 1;
      height: 100%;
      background: linear-gradient(90deg, #442a1b, #2b190f, #3b2215);
      position: relative;
      transition: transform 1.8s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: left center;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 30px 16px;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
    }

    .door-leaf.leaf-right {
      transform-origin: right center;
      border-left: 2px solid #140b06;
    }

    .door-relief-panel {
      width: 82%;
      height: 24%;
      margin: 0 auto;
      border: 2px solid #583923;
      background: #24140a;
      box-shadow: inset 0 0 14px rgba(0,0,0,0.9);
      border-radius: 4px;
    }

    .brass-door-handle {
      position: absolute;
      top: 54%;
      width: 12px;
      height: 55px;
      background: linear-gradient(180deg, #d4af37, #9b7924);
      border-radius: 6px;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.7);
    }

    .door-leaf.leaf-left .brass-door-handle { right: 18px; }
    .door-leaf.leaf-right .brass-door-handle { left: 18px; }

    .door-click-prompt {
      position: absolute;
      bottom: -46px;
      background: rgba(14, 13, 17, 0.9);
      color: var(--accent-gold);
      border: 1px solid var(--accent-brass);
      padding: 9px 24px;
      border-radius: 40px;
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      animation: bounceTag 2.2s infinite ease-in-out;
    }

    @keyframes bounceTag {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .door-facade-container.open .leaf-left {
      transform: perspective(1200px) rotateY(-85deg);
    }
    .door-facade-container.open .leaf-right {
      transform: perspective(1200px) rotateY(85deg);
    }

    /* Welcome Pop-up */
    .welcome-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
    }

    .welcome-popup-overlay.show {
      display: flex;
    }

    .welcome-box {
      background: #17161b;
      border: 1px solid var(--accent-gold);
      border-radius: 12px;
      padding: 3.5rem 2.8rem;
      max-width: 620px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 90px rgba(0,0,0,0.9), 0 0 35px rgba(212, 175, 55, 0.25);
      animation: popWelcome 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .welcome-box h2 {
      font-family: 'Cinzel', serif;
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1.35;
      color: #f7f4ec;
      letter-spacing: 0.04em;
      margin-bottom: 1.4rem;
    }

    .welcome-box p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.28rem;
      color: var(--accent-brass);
      font-style: italic;
      letter-spacing: 0.04em;
    }

    @keyframes popWelcome {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ==========================================================================
       SCENE 3: MUSEUM INTERIOR (PARALLAX WALKTHROUGH)
       ========================================================================== */
    #scene-museum {
      position: relative;
      overflow: hidden;
      background-color: #0c0b0e;
    }

    .museum-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .parallax-bg-deep {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 22000px;
      background-image: 
        linear-gradient(to bottom, rgba(12, 11, 15, 0.72), rgba(18, 16, 22, 0.9)),
        url('JUST-A-CHAIR-PORTFOLIO/images/museum_interior.jpg');
      background-repeat: repeat-x;
      background-size: 1600px 100%;
      will-change: transform;
      pointer-events: none;
    }

    .parallax-walls-mid {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 30000px;
      background: linear-gradient(to bottom, #16151a 0px, #2a2830 55px, #36333c 57px, #201e25 130px, #18171e 100%);
      will-change: transform;
    }

    .museum-parquet-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 29vh;
      background: linear-gradient(to bottom, var(--floor-color-top) 0%, var(--floor-color-mid) 25%, #3d2314 70%, var(--floor-color-bot) 100%);
      border-top: 5px solid #5a361e;
      box-shadow: inset 0 25px 45px rgba(0,0,0,0.85);
      z-index: 10;
    }

    .museum-parquet-floor::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.18) 0px,
        rgba(0,0,0,0.18) 140px,
        rgba(255,255,255,0.03) 141px,
        rgba(0,0,0,0.22) 280px
      );
      opacity: 0.65;
    }

    .gallery-track {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      align-items: flex-end;
      padding-bottom: 7.5vh;
      padding-left: 9vw;
      padding-right: 18vw;
      gap: 170px;
      will-change: transform;
      z-index: 15;
    }

    .exhibit-node {
      position: relative;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.4s ease;
    }

    .exhibit-node:hover {
      transform: translateY(-8px);
    }

    /* 1. CHAIR EXHIBIT */
    .chair-node {
      width: 320px;
      cursor: pointer;
    }

    .chair-display-stage {
      width: 270px;
      height: 310px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 12px;
    }

    .chair-display-stage img {
      max-width: 100%;
      max-height: 285px;
      object-fit: contain;
      filter: drop-shadow(0 18px 25px rgba(0,0,0,0.8));
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .chair-node:hover .chair-display-stage img {
      transform: scale(1.06);
    }

    .wall-plaque-note {
      position: absolute;
      top: -38px;
      right: -65px;
      width: 140px;
      background: #faf8f2;
      color: #1a1916;
      padding: 10px 14px;
      border-radius: 3px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7), 0 2px 5px rgba(0,0,0,0.3);
      border-left: 3.5px solid var(--accent-gold);
      font-size: 0.72rem;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 5;
    }

    .wall-plaque-note:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 14px 30px rgba(212, 175, 55, 0.4);
    }

    .plaque-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.74rem;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .plaque-era {
      font-size: 0.65rem;
      color: #6d6962;
      font-style: italic;
    }

    .plaque-cta {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.62rem;
      color: #926f1c;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .museum-plinth {
      width: 260px;
      height: 95px;
      background: linear-gradient(180deg, #f0eee7 0%, #d8d4c9 60%, #c4c0b4 100%);
      border-radius: 4px 4px 0 0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.85), inset 0 2px 4px rgba(255,255,255,0.8);
      position: relative;
      border-top: 3px solid #fdfcf9;
    }

    .museum-plinth::after {
      content: '';
      position: absolute;
      bottom: -14px;
      width: 115%;
      left: -7.5%;
      height: 15px;
      background: rgba(0,0,0,0.6);
      filter: blur(10px);
      border-radius: 50%;
    }

    /* 2. GLASS BOX / VITRINE EXHIBIT */
    .glassbox-node {
      width: 290px;
    }

    .glass-showcase {
      width: 230px;
      height: 295px;
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 60%, rgba(255, 255, 255, 0.22) 100%);
      border: 1.5px solid var(--glass-border);
      box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.18), 0 15px 40px rgba(0, 0, 0, 0.8);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(1.5px);
    }

    .glass-showcase::before {
      content: '';
      position: absolute;
      top: 0;
      left: 18%;
      width: 25%;
      height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
      transform: skewX(-16deg);
      pointer-events: none;
    }

    .vitrine-content {
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vitrine-content img {
      max-width: 145px;
      max-height: 145px;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.65));
    }

    .vitrine-tag-btn {
      margin-top: 14px;
      background: rgba(18, 17, 23, 0.95);
      color: var(--accent-gold);
      border: 1px solid var(--accent-brass);
      padding: 7px 15px;
      border-radius: 20px;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
      text-align: center;
    }

    .vitrine-tag-btn:hover {
      background: var(--accent-gold);
      color: #0b0a0e;
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.65);
    }

    .white-pedestal-tall {
      width: 240px;
      height: 120px;
      background: linear-gradient(180deg, #ffffff 0%, #ebe8df 65%, #d6d2c4 100%);
      border-radius: 4px 4px 0 0;
      box-shadow: 0 20px 45px rgba(0,0,0,0.85);
      border-top: 3px solid #ffffff;
    }

    /* 3. HUMAN FIGURES WITH HOVERING TAGS */
    .human-figure-node {
      width: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .figure-container {
      width: 270px;
      height: 490px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
    }

    .figure-container img {
      max-height: 450px;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 22px 35px rgba(0,0,0,0.92));
      transition: transform 0.4s ease;
    }

    .human-figure-node:hover .figure-container img {
      transform: scale(1.035);
    }

    .hovering-overhead-tag {
      position: absolute;
      top: -10px;
      background: rgba(14, 13, 19, 0.94);
      color: #ffffff;
      border: 1.5px solid var(--accent-gold);
      padding: 9px 22px;
      border-radius: 30px;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.85), 0 0 18px rgba(212, 175, 55, 0.4);
      animation: floatHoverTag 3s ease-in-out infinite;
      white-space: nowrap;
      z-index: 20;
      transition: all 0.3s ease;
    }

    .hovering-overhead-tag:hover {
      background: var(--accent-gold);
      color: #0c0a0e;
      transform: scale(1.08) translateY(-6px);
      box-shadow: 0 16px 35px rgba(212, 175, 55, 0.75);
    }

    @keyframes floatHoverTag {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* SILHOUETTE FALLBACK */
    .museum-silhouette-fallback {
      width: 180px;
      height: 230px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0,0,0,0.45) 85%);
      border: 1px dashed var(--accent-brass);
      border-radius: 8px;
      color: var(--accent-gold);
      padding: 10px;
      text-align: center;
    }

    .museum-silhouette-fallback svg {
      width: 80px;
      height: 80px;
      fill: var(--accent-gold);
      margin-bottom: 8px;
      opacity: 0.85;
    }

    .museum-silhouette-fallback span {
      font-size: 0.75rem;
      font-family: 'Cinzel', serif;
    }

    /* 4. CONCLUDING BOARD & EXIT */
    .concluding-board-container {
      width: 660px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-left: 50px;
    }

    .curator-final-plaque {
      background: linear-gradient(145deg, #1d1b22, #131217);
      border: 2px solid var(--accent-brass);
      box-shadow: 0 30px 80px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.75);
      border-radius: 8px;
      padding: 44px 50px;
      position: relative;
    }

    .curator-final-plaque::before {
      content: 'HISTORICAL PERSPECTIVE';
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-brass);
      color: #121015;
      font-family: 'Cinzel', serif;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      padding: 4px 20px;
      border-radius: 20px;
    }

    .curator-final-plaque p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      line-height: 1.75;
      color: #f5f2e9;
      text-align: justify;
      letter-spacing: 0.02em;
    }

    .exit-door-node {
      width: 280px;
      margin-left: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .exit-portal-frame {
      width: 220px;
      height: 380px;
      border: 8px solid #362c24;
      background: #120e0a;
      box-shadow: 0 0 55px rgba(0,0,0,0.92), inset 0 0 25px rgba(0,0,0,0.9);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .exit-door-wood {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #3d2417, #2c1a10, #382115);
      border: 1px solid #5a3924;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .exit-button-tag {
      margin-top: 18px;
      background: #c53030;
      color: #fff;
      font-family: 'Cinzel', serif;
      font-size: 0.86rem;
      letter-spacing: 0.16em;
      font-weight: 700;
      padding: 8px 26px;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(197, 48, 48, 0.5);
      transition: transform 0.3s ease;
    }

    .exit-door-node:hover .exit-button-tag {
      transform: scale(1.08);

    function handleImgError(img) {
      if (!img.dataset.step) {
        img.dataset.step = "1";
        // If loaded with JUST-A-CHAIR-PORTFOLIO/ prefix, try relative without it
        img.src = img.src.replace('JUST-A-CHAIR-PORTFOLIO/', '');
      } else if (img.dataset.step === "1") {
        img.dataset.step = "2";
        // Try with leading ./
        let curr = img.getAttribute('src');
        img.src = './' + curr;
      } else {
        img.style.display = 'none';
        if (img.nextElementSibling && img.nextElementSibling.classList.contains('museum-silhouette-fallback')) {
          img.nextElementSibling.style.display = 'flex';
        }
      }
    }

    /* ==========================================================================
       AUDIO SYNTHESIZER (Native Web Audio API)
       ========================================================================== */
    class MuseumAudio {
      constructor() {
        this.ctx = null;
        this.soundOn = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playPing() {
        if (!this.soundOn) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(920, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.14);
      }

      playZoomWhoosh() {
        if (!this.soundOn) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 1.2);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 1.2);
      }

      playHeavyDoor() {
        if (!this.soundOn) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(105, this.ctx.currentTime + 0.7);
        osc.frequency.linearRampToValueAtTime(65, this.ctx.currentTime + 1.5);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 1.5);
      }

      playStep() {
        if (!this.soundOn) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(85, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.07);
      }

        if (!this.soundOn) return;

        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.55);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.55);
      }

      playExitThud() {
        if (!this.soundOn) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.45);
      }
    }

    const MUSEUM_CONCLUSION = "Chairs historically functioned as instruments of class, gender, and economic dominance, shaped directly by architecture, clothing, and manufacturing innovations. Rulers utilized monumental architectural forms, sacred carvings, and rare imports to visually elevate authority above ground-level laborers, while court protocols strictly codified rank through seat types. Concurrently, vestimentary demands and patriarchal norms sculpted chair form—narrowing backrests and flaring seat pans to enforce rigid modesty on corseted women, while male designs offered sprawling ease. Technological shifts from steam-bent wood to tubular steel and molded plastics ultimately democratized design, transforming an exclusive aristocratic luxury into an accessible global commodity.";

    /* ==========================================================================
       BUILD GALLERY EXHIBIT TRACK
       ========================================================================== */
    const galleryTrack = document.getElementById('gallery-track');

    function renderMuseumExhibits() {
      galleryTrack.innerHTML = '';

      EXHIBITS.forEach((exhibit, index) => {
        if (exhibit.type === 'chair') {
          const el = document.createElement('div');
          el.className = 'exhibit-node chair-node';
          el.innerHTML = `
            <div class="wall-plaque-note" onclick="displayExhibitModal(${index})">
              <div class="plaque-title">${exhibit.title}</div>
              <div class="plaque-era">${exhibit.period}</div>
              <span class="plaque-cta">View Note &#8594;</span>
            </div>
            <div class="chair-display-stage" onclick="displayExhibitModal(${index})">
              <img src="${exhibit.image}" alt="${exhibit.title}" onerror="handleImgError(this)">
              <div class="museum-silhouette-fallback">
                <svg viewBox="0 0 24 24"><path d="M7 11V3h10v8h3v8h-2v4h-2v-4H8v4H6v-4H4v-8h3zm2-6v6h6V5H9zm-3 8v4h12v-4H6z"/></svg>
                <span>${exhibit.title}</span>
              </div>
            </div>
            <div class="museum-plinth"></div>
          `;
          galleryTrack.appendChild(el);
        }
        else if (exhibit.type === 'glassbox') {
          const el = document.createElement('div');
          el.className = 'exhibit-node glassbox-node';
          el.innerHTML = `
            <div class="glass-showcase">
              <div class="vitrine-content">
                <img src="${exhibit.image}" alt="${exhibit.tag}" onerror="handleImgError(this)">
                <div class="museum-silhouette-fallback" style="width:120px;height:120px;">
                  <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
                  <span style="font-size:0.65rem;">Specimen</span>
                </div>
              </div>
              <button class="vitrine-tag-btn" onclick="displayExhibitModal(${index})">
                [ ${exhibit.tag} ]
              </button>
            </div>
            <div class="white-pedestal-tall"></div>
          `;
          galleryTrack.appendChild(el);
        }
        else if (exhibit.type === 'figure') {
          const el = document.createElement('div');
          el.className = 'exhibit-node human-figure-node';
          el.innerHTML = `
            <div class="figure-container" onclick="displayExhibitModal(${index})">
              <div class="hovering-overhead-tag">[ ${exhibit.tag} ]</div>
              <img src="${exhibit.image}" alt="${exhibit.title}" onerror="handleImgError(this)">
              <div class="museum-silhouette-fallback" style="height:360px;width:190px;">
                <svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 100 8 4 4 0 000-8zm0 10c-4.42 0-8 2.69-8 6v4h16v-4c0-3.31-3.58-6-8-6z"/></svg>
                <span>${exhibit.fallbackLabel}</span>
              </div>
            </div>
          `;
          galleryTrack.appendChild(el);
        }
      });

      // Append Concluding Curator Board
      const board = document.createElement('div');
      board.className = 'concluding-board-container';
      board.innerHTML = `
        <div class="curator-final-plaque">
          <p>${MUSEUM_CONCLUSION}</p>
        </div>
      `;
      galleryTrack.appendChild(board);

      // Append Museum Exit Door
      const exitPortal = document.createElement('div');
      exitPortal.className = 'exit-door-node';
      exitPortal.innerHTML = `
        <div class="exit-portal-frame">
          <div class="exit-door-wood">
            <svg style="width:48px;height:48px;fill:#d4af37;opacity:0.85;" viewBox="0 0 24 24">
              <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
            </svg>
          </div>
        </div>
        <div class="exit-button-tag">EXIT MUSEUM</div>
      `;
      exitPortal.addEventListener('click', handleMuseumExit);
      galleryTrack.appendChild(exitPortal);
    }

    renderMuseumExhibits();

    /* ==========================================================================
       SCENE 1: CHAT TIMING & DYNAMIC ZOOM TRANSITION
       ========================================================================== */
    const sceneChat = document.getElementById('scene-chat');
    const sceneDoor = document.getElementById('scene-door');
    const sceneMuseum = document.getElementById('scene-museum');

    const chatContainer = document.getElementById('chat-container');
    const bubbleTrigger = document.getElementById('chat-bubble-trigger');

    setTimeout(() => soundEngine.playPing(), 350);
    setTimeout(() => {
      soundEngine.playPing();
      bubbleTrigger.classList.add('interactive-pulse');
    }, 1450);

    bubbleTrigger.addEventListener('click', () => {
      soundEngine.playZoomWhoosh();
      chatContainer.classList.add('chat-zooming');

      setTimeout(() => {
        sceneChat.classList.remove('active');
        sceneDoor.classList.add('active');
      }, 950);
    });

    /* ==========================================================================
       SCENE 2: MUSEUM DOOR & WELCOME MODAL
       ========================================================================== */
    const doorFacade = document.getElementById('door-facade');
    const welcomeModal = document.getElementById('welcome-modal');

    doorFacade.addEventListener('click', () => {
      soundEngine.playHeavyDoor();
      doorFacade.classList.add('open');

      setTimeout(() => {
        welcomeModal.classList.add('show');
        soundEngine.playExhibitChime();
      }, 700);
    });

    welcomeModal.addEventListener('click', () => {
      welcomeModal.classList.remove('show');
      soundEngine.playStep();

      setTimeout(() => {
        sceneDoor.classList.remove('active');
        sceneMuseum.classList.add('active');
        currentWalkPosition = 0;
        targetWalkPosition = 0;
        applyParallaxTransform();
      }, 400);
    });

    /* ==========================================================================
       SCENE 3: PARALLAX WALK ENGINE (CLICK, ARROWS, A/D, WHEEL)
       ========================================================================== */
    let currentWalkPosition = 0;
    let targetWalkPosition = 0;
    const walkDistanceUnit = 440;
    let maxGalleryBoundary = 0;

    const layerBg = document.getElementById('layer-bg');
    const layerWalls = document.getElementById('layer-walls');
    const eraIndicator = document.getElementById('era-indicator');

    function calculateGalleryBounds() {
      const trackWidth = galleryTrack.scrollWidth;
      const viewWidth = window.innerWidth;
      maxGalleryBoundary = Math.max(0, trackWidth - viewWidth + 300);
    }

    window.addEventListener('resize', calculateGalleryBounds);
    setTimeout(calculateGalleryBounds, 500);

    function stepWalk(delta) {
      calculateGalleryBounds();
      targetWalkPosition = Math.max(0, Math.min(targetWalkPosition + delta, maxGalleryBoundary));
      soundEngine.playStep();
    }

    function animateParallaxLoop() {
      currentWalkPosition += (targetWalkPosition - currentWalkPosition) * 0.085;
      applyParallaxTransform();
      requestAnimationFrame(animateParallaxLoop);
    }
    requestAnimationFrame(animateParallaxLoop);

    function applyParallaxTransform() {
      galleryTrack.style.transform = `translateX(${-currentWalkPosition}px)`;
      layerWalls.style.transform = `translateX(${-currentWalkPosition * 0.55}px)`;
      layerBg.style.transform = `translateX(${-currentWalkPosition * 0.25}px)`;

      if (eraIndicator) {
        const progress = currentWalkPosition / (maxGalleryBoundary || 1);
        if (progress < 0.16) eraIndicator.textContent = 'Ancient Egypt & Classical Greece';
        else if (progress < 0.36) eraIndicator.textContent = 'Medieval Feudalism & Renaissance';
        else if (progress < 0.56) eraIndicator.textContent = 'Ming Dynasty & French Royal Court';
        else if (progress < 0.76) eraIndicator.textContent = 'Industrialization & Mass Production';
        else if (progress < 0.92) eraIndicator.textContent = 'Bauhaus Modernism & Digital Age';
        else eraIndicator.textContent = 'Curator Board & Museum Exit';
      }
    }

    // HUD Button click controls
    document.getElementById('btn-walk-left').addEventListener('click', () => stepWalk(-walkDistanceUnit));
    document.getElementById('btn-walk-right').addEventListener('click', () => stepWalk(walkDistanceUnit));

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (!sceneMuseum.classList.contains('active')) return;
      if (document.getElementById('museum-modal').classList.contains('active')) return;

      if (e.key === 'ArrowRight' || e.key === 'KeyD') stepWalk(walkDistanceUnit);
      else if (e.key === 'ArrowLeft' || e.key === 'KeyA') stepWalk(-walkDistanceUnit);
    });

    // Mouse wheel scrolling
    window.addEventListener('wheel', (e) => {
      if (!sceneMuseum.classList.contains('active')) return;
      if (document.getElementById('museum-modal').classList.contains('active')) return;

      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      stepWalk(delta * 1.5);
    }, { passive: true });

    /* ==========================================================================
       MODAL POPUP DIALOGS (EXACT TEXT WORD-FOR-WORD)
       ========================================================================== */
    const museumModal = document.getElementById('museum-modal');
    const modalInjected = document.getElementById('modal-injected-content');
    const modalClose = document.getElementById('modal-close-btn');

    window.displayExhibitModal = function(index) {
      const item = EXHIBITS[index];
      if (!item) return;

      soundEngine.playExhibitChime();
      let markup = '';

      if (item.type === 'chair') {
        markup = `
          <h3 class="exhibit-modal-title">${item.title}</h3>
          <div class="exhibit-field"><span class="field-tag">Time Period:</span> <span class="field-value">${item.period}</span></div>
          <div class="exhibit-field"><span class="field-tag">Designer:</span> <span class="field-value">${item.designer}</span></div>
          <div class="exhibit-field"><span class="field-tag">Form:</span> <span class="field-value">${item.form}</span></div>
          <div class="exhibit-field"><span class="field-tag">Used By:</span> <span class="field-value">${item.usedBy}</span></div>
        `;
      }
      else if (item.type === 'glassbox') {
        markup = `
          <h3 class="exhibit-modal-title">[ ${item.tag} ]</h3>
          <div class="exhibit-field"><span class="field-tag">Crucial Materials:</span> <span class="field-value">(${item.materials})</span></div>
          <div class="exhibit-field"><span class="field-tag">Why Used:</span> <span class="field-value">${item.whyUsed}</span></div>
          <div class="exhibit-field"><span class="field-tag">Morphological Impact:</span> <span class="field-value">${item.morphologicalImpact}</span></div>
        `;
      }
      else if (item.type === 'figure') {
        markup = `
          <h3 class="exhibit-modal-title">[ ${item.tag} ]</h3>
          <div class="figure-speech-text">${item.speech}</div>
        `;
      }

      modalInjected.innerHTML = markup;
      museumModal.classList.add('active');
    };

    function hideModal() {
      museumModal.classList.remove('active');
    }

    modalClose.addEventListener('click', hideModal);
    museumModal.addEventListener('click', (e) => {
      if (e.target === museumModal) hideModal();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && museumModal.classList.contains('active')) hideModal();
    });

    /* ==========================================================================
       EXIT FLOW & RETURN TO CHAT
       ========================================================================== */
    function handleMuseumExit() {
      soundEngine.playExitThud();
      sceneMuseum.classList.remove('active');

      doorFacade.classList.remove('open');
      chatContainer.classList.remove('chat-zooming');

      setTimeout(() => {
        sceneChat.classList.add('active');
        bubbleTrigger.classList.add('interactive-pulse');
      }, 500);
    }

    /* ==========================================================================
       SOUND TOGGLE CONTROL
       ========================================================================== */
    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-status-icon');

    soundBtn.addEventListener('click', () => {
      soundEngine.soundOn = !soundEngine.soundOn;
      soundIcon.textContent = soundEngine.soundOn ? '🔊' : '🔇';
    });
  </script>
</body>
