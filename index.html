<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum of Chairs</title>
    <style>
        /* GLOBAL STYLES */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            overflow: hidden;
            background-color: #000;
            color: #333;
        }

        /* SCREENS */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            transition: opacity 1s ease-in-out;
        }
        .active-screen {
            display: flex;
            opacity: 1;
        }

        /* CHAT SCREEN */
        #chat-screen {
            background-color: #000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
        }
        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 16px;
            line-height: 1.4;
        }
        .received {
            background-color: #333333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .sent {
            background-color: #007AFF;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            display: none;
            transform-origin: right center;
            transition: transform 2s ease-in, opacity 2s ease-in;
        }
        .chat-input-area {
            margin-top: 30px;
            display: flex;
            width: 100%;
            max-width: 400px;
            gap: 10px;
        }
        #chat-input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #444;
            background: #111;
            color: white;
            font-size: 16px;
        }
        #send-btn {
            background-color: #007AFF;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .zoom-effect {
            transform: scale(20);
            opacity: 0;
        }

        /* DOOR SCREEN */
        #door-screen {
            background-image: url('museum_door.jpg'); /* Replace with exact path if needed */
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }

        /* MUSEUM INTERIOR SCREEN */
        #museum-screen {
            background-image: url('museum_interior.jpg'); /* Replace with exact path if needed */
            background-size: cover;
            background-position: center bottom;
            background-repeat: repeat-x;
            overflow-x: auto;
            overflow-y: hidden;
            display: none; /* Flex applied via JS */
            align-items: flex-end;
            padding-bottom: 50px; /* Floor height */
        }
        
        .museum-content {
            display: flex;
            align-items: flex-end;
            gap: 120px;
            padding: 0 200px;
            height: 100%;
            min-width: max-content;
        }

        /* MUSEUM ITEMS */
        .museum-item {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }
        .museum-item:hover {
            transform: scale(1.05);
        }
        .museum-item img {
            max-height: 250px;
            object-fit: contain;
            box-shadow: 0px 10px 15px rgba(0,0,0,0.5);
        }
        .glass-box {
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.2), 0 10px 20px rgba(0,0,0,0.5);
        }
        .glass-box img {
            max-height: 150px;
            box-shadow: none;
        }

        /* HOVER TAGS */
        .hover-tag {
            position: absolute;
            top: -40px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            pointer-events: none;
            font-family: sans-serif;
        }
        .museum-item:hover .hover-tag {
            opacity: 1;
        }

        /* EXIT BOARD */
        .exit-board {
            background: #2c2c2c;
            color: #d4af37;
            padding: 30px;
            border: 5px solid #4a3b2c;
            max-width: 500px;
            font-size: 16px;
            line-height: 1.6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 50px;
        }
        .exit-door {
            height: 300px;
            width: 150px;
            background: #3e2723;
            border: 2px solid #1a1007;
            margin-left: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            text-transform: uppercase;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        /* MODAL */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fdfaf2;
            padding: 40px;
            max-width: 600px;
            border-radius: 5px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            font-size: 18px;
            line-height: 1.6;
            border: 1px solid #ccc;
        }
        .modal-content h2 {
            margin-top: 0;
            color: #5a4a42;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .modal-close-hint {
            display: block;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
            text-align: center;
            font-family: sans-serif;
        }

        /* Utility classes */
        .hidden { display: none !important; }

    </style>
</head>

                image: "JUST-A-CHAIR-PORTFOLIO/images/materials/materials 10.jpg",
                title: "Isotactic Polypropylene",
                text: "<strong>Why Used:</strong> Low-cost polymer blended with calcium carbonate and titanium dioxide for single-shot, rapid automated manufacturing.<br><br><strong>Morphological Impact:</strong> Formed a seamless, jointless, stackable, and waterproof monobloc shell."
            },
            {
                tag: "[1994–Present (Digital Age)]",
                image: "JUST-A-CHAIR-PORTFOLIO/images/materials/materials 11.jpg",
                title: "Die-Cast Aluminum, Nylon, and Pellicle Elastomeric Mesh",
                text: "<strong>Why Used:</strong> Engineered to dissipate metabolic heat and support prolonged sedentary computer work.<br><br><strong>Morphological Impact:</strong> Replaced foam cushions with an ergonomic, biomorphic suspension frame powered by kinematic tilt mechanisms."
            }
        ];

        // --- INTERACTION LOGIC ---

        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const sentMessage = document.getElementById('sent-message');
        const chatUi = document.getElementById('chat-ui');
        
        const chatScreen = document.getElementById('chat-screen');
        const doorScreen = document.getElementById('door-screen');
        const museumScreen = document.getElementById('museum-screen');
        
        const modalOverlay = document.getElementById('modal-overlay');
        const modalText = document.getElementById('modal-text');
        
        let doorState = 0; // 0 = unclicked, 1 = clicked

        // 1. Chat Interaction
        sendBtn.addEventListener('click', handleChat);
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleChat();
        });

        function handleChat() {
            if(chatInput.value.trim() === "JUST A CHAIR?!") {
                chatUi.style.display = 'none';
                sentMessage.style.display = 'block';
                
                // Trigger Zoom
                setTimeout(() => {
                    sentMessage.classList.add('zoom-effect');
                }, 500);

                // Transition to Door
                setTimeout(() => {
                    chatScreen.classList.remove('active-screen');
                    doorScreen.classList.add('active-screen');
                }, 2500);
            } else {
                alert("Type exactly: JUST A CHAIR?!");
            }
        }

        // 2. Door Interaction
        doorScreen.addEventListener('click', () => {
            if (doorState === 0) {
                showModal("<h2>Welcome</h2>Welcome to the museum of chairs by Anamika Nandi");
                doorState = 1;
            } else if (doorState === 1) {
                doorScreen.classList.remove('active-screen');
                museumScreen.classList.add('active-screen');
                museumScreen.style.display = 'flex'; // Enable horizontal flex scroll
            }
        });

        // 3. Populate Museum Content dynamically
        const museumContent = document.getElementById('museum-content');

        // Helper to build elements
        function createItem(type, data) {
            const wrapper = document.createElement('div');
            wrapper.className = 'museum-item';
            
            const tag = document.createElement('div');
            tag.className = 'hover-tag';
            
            const img = document.createElement('img');
            img.src = data.image;
            img.alt = data.name || data.tag;

            if(type === 'chair') {
                tag.innerText = data.name;
                wrapper.onclick = () => showModal(`<h2>${data.name}</h2>${data.text}`);
            } else if (type === 'figure') {
                tag.innerText = data.tag;
                wrapper.onclick = () => showModal(`<h2>${data.tag}</h2>${data.text}`);
            } else if (type === 'material') {
                wrapper.className = 'museum-item glass-box';
                tag.innerText = data.tag;
                wrapper.onclick = () => showModal(`<h2>${data.title}</h2>${data.text}`);
            }

            wrapper.appendChild(tag);
            wrapper.appendChild(img);
            museumContent.appendChild(wrapper);
        }

        // Interleave items sequentially to simulate a walking tour
        let c = 0; // Chair index
        let m = 0; // Material index
        let f = 0; // Figure index

        // Inject Figure 1 [Gender]
        createItem('figure', figures[f++]);
        
        // Group 1: Ancient to Renaissance
        for(let i = 0; i < 6; i++) {
            createItem('chair', chairs[c++]);
            if (m < 4) createItem('material', materials[m++]);
        }

        // Inject Figure 2 [Social]
        createItem('figure', figures[f++]);

        // Group 2: Ming to Industrial
        for(let i = 0; i < 6; i++) {
            createItem('chair', chairs[c++]);
            if (m < 8) createItem('material', materials[m++]);
        }

        // Inject Figure 3 [Economical]
        createItem('figure', figures[f++]);

        // Group 3: Industrial to Modern
        for(let i = 0; i < 8; i++) {
            if(c < chairs.length) createItem('chair', chairs[c++]);
            if (m < materials.length) createItem('material', materials[m++]);
        }

        // Inject Figure 4 [Corporate]
        createItem('figure', figures[f++]);

        // 4. End of Museum Board
        const board = document.createElement('div');
        board.className = 'exit-board';
        board.innerHTML = "Chairs historically functioned as instruments of class, gender, and economic dominance, shaped directly by architecture, clothing, and manufacturing innovations. Rulers utilized monumental architectural forms, sacred carvings, and rare imports to visually elevate authority above ground-level laborers, while court protocols strictly codified rank through seat types. Concurrently, vestimentary demands and patriarchal norms sculpted chair form—narrowing backrests and flaring seat pans to enforce rigid modesty on corseted women, while male designs offered sprawling ease. Technological shifts from steam-bent wood to tubular steel and molded plastics ultimately democratized design, transforming an exclusive aristocratic luxury into an accessible global commodity.";
        museumContent.appendChild(board);

        // 5. Exit Door
        const exit = document.createElement('div');
        exit.className = 'exit-door';
        exit.innerText = "Exit";
        exit.onclick = () => {
            museumScreen.classList.remove('active-screen');
            museumScreen.style.display = 'none';
            chatScreen.classList.add('active-screen');
            
            // Reset Chat
            chatInput.value = '';
            chatUi.style.display = 'flex';
            sentMessage.style.display = 'none';
            sentMessage.classList.remove('zoom-effect');
            doorState = 0;
            museumScreen.scrollLeft = 0;
        };
        museumContent.appendChild(exit);

        // 6. Modal Functions
        function showModal(htmlContent) {
            modalText.innerHTML = htmlContent + '<span class="modal-close-hint">(Click anywhere to close)</span>';
            modalOverlay.style.display = 'flex';
        }

        modalOverlay.addEventListener('click', () => {
            if (doorState === 1 && modalOverlay.style.display === 'flex') {
                // Special case: Closing the welcome door modal shouldn't do anything yet,
                // the user must click the background to enter the museum.
                modalOverlay.style.display = 'none';
            } else {
                modalOverlay.style.display = 'none';
            }
        });

    </script>
</body>
</html>
